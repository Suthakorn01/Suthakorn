
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barcode Decoder</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 24px;
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
}
.container {
  max-width: 650px;
  margin: 30px auto;
}
h1 { text-align: center; }
.subtitle {
  text-align: center;
  color: #9caec5;
}
.panel {
  background: #1d293b;
  border: 1px solid #34445b;
  border-radius: 16px;
  padding: 22px;
  margin-top: 20px;
}
button, .upload {
  display: block;
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: 0;
  border-radius: 9px;
  background: #2675f5;
  color: white;
  font-size: 16px;
  cursor: pointer;
  text-align: center;
}
.upload { background: #35465e; }
video, canvas {
  width: 100%;
  border-radius: 12px;
  margin-top: 15px;
}
#result {
  background: #111c2b;
  padding: 15px;
  border-radius: 10px;
  overflow-wrap: anywhere;
  min-height: 65px;
  white-space: pre-wrap;
}
.label { color: #8fa9c9; margin-top: 15px; }
input[type=file] { display: none; }
.status { color: #55d99b; }
</style>
</head>
<body>
<div class="container">
  <h1>🔎 Barcode Decoder</h1>
  <p class="subtitle">สแกนและถอดรหัสข้อมูลจากบาร์โค้ด</p>

  <div class="panel">
    <h3>📷 สแกนด้วยกล้อง</h3>
    <button onclick="startCamera()">เปิดกล้อง</button>
    <video id="video" autoplay playsinline></video>
    <button onclick="stopCamera()" style="background:#a33d4d">
      ปิดกล้อง
    </button>
  </div>

  <div class="panel">
    <h3>🖼️ อัปโหลดรูปบาร์โค้ด</h3>
    <label class="upload" for="file">
      เลือกรูปภาพจากอุปกรณ์
    </label>
    <input id="file" type="file" accept="image/*">
    <canvas id="canvas" hidden></canvas>
  </div>

  <div class="panel">
    <h3>📋 ผลการถอดรหัส</h3>
    <div class="label">ประเภทบาร์โค้ด</div>
    <div id="format">ยังไม่มีข้อมูล</div>

    <div class="label">ข้อมูลที่ถอดรหัสได้</div>
    <div id="result">รอการสแกน...</div>

    <button onclick="copyResult()">📋 คัดลอกข้อมูล</button>
    <button onclick="clearResult()" style="background:#35465e">
      ล้างข้อมูล
    </button>
    <p id="status" class="status"></p>
  </div>
</div>

<script>
let detector;
let stream;
let scanning = false;

const video = document.getElementById("video");
const result = document.getElementById("result");
const format = document.getElementById("format");
const status = document.getElementById("status");

async function initDetector() {
  if (!("BarcodeDetector" in window)) {
    throw new Error(
      "เบราว์เซอร์นี้ไม่รองรับ BarcodeDetector"
    );
  }

  const supported = await BarcodeDetector.getSupportedFormats();
  const formats = [
    "qr_code", "ean_13", "ean_8",
    "upc_a", "upc_e", "code_128",
    "code_39", "itf", "codabar",
    "data_matrix", "pdf417", "aztec"
  ].filter(x => supported.includes(x));

  detector = new BarcodeDetector({ formats });
}

function showResult(data) {
  format.textContent = data.format;
  result.textContent = data.rawValue;
  status.textContent = "✓ ถอดรหัสสำเร็จ";
}

async function startCamera() {
  try {
    await initDetector();

    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }
    });

    video.srcObject = stream;
    await video.play();

    scanning = true;
    scanLoop();
    status.textContent = "กำลังค้นหาบาร์โค้ด...";
  } catch (e) {
    status.textContent = "ไม่สามารถเปิดกล้องได้: " + e.message;
  }
}

async function scanLoop() {
  if (!scanning || !detector) return;

  try {
    const codes = await detector.detect(video);

    if (codes.length > 0) {
      showResult(codes[0]);
      stopCamera();
      return;
    }
  } catch (e) {
    console.log(e);
  }

  if (scanning) requestAnimationFrame(scanLoop);
}

function stopCamera() {
  scanning = false;
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }
  video.srcObject = null;
}

document.getElementById("file").addEventListener("change",
  async function(event) {
    const file = event.target.files[0];
    if (!file) return;

    try {
      await initDetector();

      const img = new Image();
      img.src = URL.createObjectURL(file);

      await new Promise((resolve, reject) => {
        img.onload = resolve;
        img.onerror = reject;
      });

      const codes = await detector.detect(img);

      if (codes.length) {
        showResult(codes[0]);
      } else {
        status.textContent =
          "ไม่พบบาร์โค้ดในรูปภาพ กรุณาลองรูปใหม่";
      }

      URL.revokeObjectURL(img.src);
    } catch (e) {
      status.textContent = "เกิดข้อผิดพลาด: " + e.message;
    }
  }
);

function copyResult() {
  navigator.clipboard.writeText(result.textContent)
    .then(() => status.textContent = "คัดลอกแล้ว!");
}

function clearResult() {
  format.textContent = "ยังไม่มีข้อมูล";
  result.textContent = "รอการสแกน...";
  status.textContent = "";
}
</script>
</body>
</html>
