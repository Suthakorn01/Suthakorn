
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Barcode Reader</title>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 18px;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      color: #222;
    }
    .app {
      max-width: 520px;
      margin: auto;
      background: white;
      padding: 18px;
      border-radius: 16px;
      box-shadow: 0 3px 15px #0001;
    }
    h2 { text-align: center; margin-top: 4px; }
    .camera {
      position: relative;
      width: 100%;
      background: #111;
      border-radius: 12px;
      overflow: hidden;
      min-height: 220px;
    }
    video {
      display: block;
      width: 100%;
      min-height: 220px;
      object-fit: cover;
    }
    .guide {
      position: absolute;
      left: 5%;
      width: 90%;
      top: 18%;
      height: 65%;
      border: 2px dashed #00e676;
      border-radius: 8px;
      pointer-events: none;
    }
    .guide-label {
      position: absolute;
      bottom: 5px;
      left: 0;
      width: 100%;
      text-align: center;
      color: white;
      font-size: 12px;
      text-shadow: 0 1px 3px black;
      pointer-events: none;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 0;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .5; }
    .primary { background: #1769e0; color: white; }
    .green { background: #168447; color: white; }
    .gray { background: #e7e9ed; color: #222; }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #bbb;
      border-radius: 8px;
      font-size: 20px;
      margin-top: 8px;
    }
    .section { margin-top: 18px; }
    .status {
      background: #f3f5f7;
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
      font-size: 14px;
      overflow-wrap: anywhere;
    }
    .small { color: #666; font-size: 12px; line-height: 1.5; }
    #progress { margin-top: 8px; font-size: 13px; color: #555; }
  </style>
</head>

<body>
<div class="app">
  <h2>ระบบอ่านเลขบาร์โค้ด</h2>

  <div class="camera">
    <video id="video" autoplay muted playsinline></video>
    <div class="guide"></div>
    <div class="guide-label">จัดบาร์โค้ดและเลขด้านล่างให้อยู่ในกรอบ</div>
  </div>

  <button class="primary" id="startBtn" onclick="startCamera()">
    เปิดกล้อง
  </button>

  <button class="green" id="readBtn" onclick="readPrintedNumber()" disabled>
    อ่านเลขใต้บาร์โค้ด
  </button>

  <div id="progress"></div>

  <div class="section">
    <label><b>เลขที่อ่านได้ (แก้ไขได้)</b></label>
    <input id="codeInput" type="text" placeholder="ตัวอย่าง 51080-1">
    <div class="small">
      ระบบจะอ่านข้อความที่พิมพ์อยู่ใต้เส้นบาร์โค้ด
      กรุณาตรวจสอบเลขก่อนบันทึก
    </div>
  </div>

  <button class="primary" id="saveBtn" onclick="saveRecord()">
    บันทึกลง Google Sheets
  </button>

  <button class="gray" onclick="stopCamera()">ปิดกล้อง</button>

  <div class="status" id="status">สถานะ: พร้อมใช้งาน</div>
</div>

<canvas id="workCanvas" hidden></canvas>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwcfqP6idWEa6fOdv_bt33gHkiugkF5800sgDCKTGszfnl8womkvJL6n_7xoJcrRZgY/exec";

const video = document.getElementById("video");
const canvas = document.getElementById("workCanvas");
const ctx = canvas.getContext("2d", { willReadFrequently: true });

let cameraStream = null;
let ocrWorker = null;
let currentFingerprint = "";
let busy = false;

function setStatus(message) {
  document.getElementById("status").textContent = "สถานะ: " + message;
}

function setProgress(message) {
  document.getElementById("progress").textContent = message;
}

async function startCamera() {
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error("เบราว์เซอร์ไม่รองรับกล้อง กรุณาเปิดผ่าน HTTPS ใน Safari");
    }

    stopCamera();

    cameraStream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      }
    });

    video.srcObject = cameraStream;
    await video.play();

    document.getElementById("readBtn").disabled = false;
    setStatus("เปิดกล้องแล้ว จัดเลขใต้บาร์โค้ดให้อยู่ในกรอบ");
  } catch (error) {
    setStatus("เปิดกล้องไม่สำเร็จ: " + error.message);
  }
}

function stopCamera() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(track => track.stop());
    cameraStream = null;
  }

  video.srcObject = null;
  document.getElementById("readBtn").disabled = true;
}

async function getOcrWorker() {
  if (ocrWorker) return ocrWorker;

  if (!window.Tesseract) {
    throw new Error("โหลดระบบ OCR ไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ต");
  }

  setProgress("กำลังเตรียมระบบอ่านตัวหนังสือ...");

  ocrWorker = await Tesseract.createWorker("eng");

  await ocrWorker.setParameters({
    tessedit_char_whitelist: "0123456789-",
    tessedit_pageseg_mode: "7",
    preserve_interword_spaces: "1"
  });

  return ocrWorker;
}

// ตัดภาพบริเวณใต้เส้นบาร์โค้ด
function captureTextArea() {
  if (!video.videoWidth || !video.videoHeight) {
    throw new Error("กรุณาเปิดกล้องก่อน");
  }

  const vw = video.videoWidth;
  const vh = video.videoHeight;

  // อ่านแถบด้านล่างของภาพ ซึ่งเป็นตำแหน่งเลขกำกับบาร์โค้ด
  const sx = Math.round(vw * 0.05);
  const sy = Math.round(vh * 0.56);
  const sw = Math.round(vw * 0.90);
  const sh = Math.round(vh * 0.38);

  canvas.width = sw * 3;
  canvas.height = sh * 3;

  ctx.filter = "grayscale(1) contrast(2)";
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
  ctx.filter = "none";

  return canvas;
}

// สร้างลายนิ้วมือภาพ 128 บิตสำหรับใช้จับคู่บาร์โค้ด
function makeFingerprint(sourceCanvas) {
  const temp = document.createElement("canvas");
  temp.width = 16;
  temp.height = 8;

  const tctx = temp.getContext("2d", { willReadFrequently: true });
  tctx.drawImage(sourceCanvas, 0, 0, 16, 8);

  const pixels = tctx.getImageData(0, 0, 16, 8).data;
  let total = 0;

  for (let i = 0; i < 128; i++) {
    total += pixels[i * 4];
  }

  const average = total / 128;
  let bits = "";

  for (let i = 0; i < 128; i++) {
    bits += pixels[i * 4] >= average ? "1" : "0";
  }

  return bits;
}

async function readPrintedNumber() {
  if (busy) return;

  busy = true;
  const readBtn = document.getElementById("readBtn");
  readBtn.disabled = true;

  try {
    setStatus("กำลังอ่านเลขใต้บาร์โค้ด...");
    setProgress("กำลังประมวลผลภาพ");

    const imageCanvas = captureTextArea();
    currentFingerprint = makeFingerprint(imageCanvas);

    const worker = await getOcrWorker();

    setProgress("กำลังอ่านข้อความ กรุณารอสักครู่...");

    const result = await worker.recognize(imageCanvas);
    const rawText = result.data.text || "";

    // เก็บเฉพาะชุดตัวเลขและเครื่องหมายขีด
    const matches = rawText.match(/[0-9]+(?:-[0-9]+)*/g) || [];

    if (!matches.length) {
      setStatus("ยังอ่านเลขไม่พบ ลองขยับกล้องให้ชัดและกดอ่านอีกครั้ง");
      setProgress("ข้อความที่ OCR อ่านได้: " + rawText);
      return;
    }

    // เลือกข้อความที่มีขีดก่อน หากไม่มีให้เลือกชุดตัวเลขที่ยาวที่สุด
    const candidate =
      matches.find(value => value.includes("-")) ||
      matches.sort((a, b) => b.length - a.length)[0];

    document.getElementById("codeInput").value = candidate;

    const confidence = Math.round(result.data.confidence || 0);

    setStatus("อ่านได้: " + candidate + " | ความมั่นใจ OCR " + confidence + "%");
    setProgress("ตรวจสอบเลขให้ถูกต้องก่อนกดบันทึก");
  } catch (error) {
    setStatus("อ่านไม่สำเร็จ: " + error.message);
  } finally {
    busy = false;
    readBtn.disabled = !cameraStream;
  }
}

// ส่งคำขอแบบ JSONP เพื่อหลีกเลี่ยงปัญหา CORS
function jsonp(params, timeoutMs = 25000) {
  return new Promise((resolve, reject) => {
    const callbackName = "barcode_cb_" + Date.now() + "_" +
      Math.floor(Math.random() * 100000);

    const script = document.createElement("script");
    const query = new URLSearchParams({
      ...params,
      callback: callbackName
    });

    let finished = false;

    const timer = setTimeout(() => {
      finish();
      reject(new Error("หมดเวลารอการตอบกลับจาก Google Sheets"));
    }, timeoutMs);

    function finish() {
      if (finished) return;
      finished = true;
      clearTimeout(timer);
      delete window[callbackName];
      script.remove();
    }

    window[callbackName] = data => {
      finish();
      resolve(data);
    };

    script.onerror = () => {
      finish();
      reject(new Error("เชื่อมต่อ Google Apps Script ไม่สำเร็จ"));
    };

    script.src = API_URL + "?" + query.toString();
    document.body.appendChild(script);
  });
}

async function saveRecord() {
  if (busy) return;

  const code = document.getElementById("codeInput").value.trim();

  if (!code) {
    setStatus("กรุณาอ่านหรือกรอกเลขบาร์โค้ดก่อน");
    return;
  }

  if (!currentFingerprint) {
    setStatus("กรุณากดอ่านเลขใต้บาร์โค้ดก่อนบันทึก เพื่อเก็บข้อมูลภาพ");
    return;
  }

  busy = true;
  const saveBtn = document.getElementById("saveBtn");
  saveBtn.disabled = true;

  try {
    setStatus("กำลังส่งข้อมูลไป Google Sheets...");

    const result = await jsonp({
      action: "save",
      code: code,
      fingerprint: currentFingerprint
    });

    if (!result || !result.ok) {
      throw new Error(result && result.error
        ? result.error
        : "Google Sheets ไม่ยืนยันการบันทึก");
    }

    setStatus("บันทึกสำเร็จ: " + code);
    setProgress("ส่งข้อมูลไป Google Sheets เรียบร้อยแล้ว");

  } catch (error) {
    setStatus("ยังยืนยันการบันทึกไม่ได้: " + error.message);
    setProgress("ตรวจสอบแท็บ BarcodeMemory ใน Google Sheets ก่อนลองบันทึกซ้ำ");
  } finally {
    busy = false;
    saveBtn.disabled = false;
  }
}
</script>
</body>
</html>
